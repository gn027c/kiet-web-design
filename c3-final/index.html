<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Photo Gallery | Nguyen Kiet</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/gallery.js" defer></script>
</head>
<body onload="initGallery()">

  <header>
    <h1>Accessible Photo Gallery</h1>
    <p>By Nguyen Kiet - Full Keyboard &amp; Screen Reader Accessibility</p>
  </header>

  <main>
    <div id="image" aria-live="polite">
      Hover over or Tab through an image below to display here.
    </div>

    <div class="thumbnails" role="region" aria-label="Photo Gallery Thumbnails">
      <img class="preview" tabindex="0" alt="Snowy Mountain Peaks in Winter" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" tabindex="0" alt="Sunburst Through Deep Pines" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" tabindex="0" alt="Tropical White Sand Coastline" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" tabindex="0" alt="Golden Canyon Sunset" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" tabindex="0" alt="Crisp Autumn River Reflection" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
      <img class="preview" tabindex="0" alt="Misty Cascade Waterfall" src="https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Nguyen Kiet. Built for Course 3 Final Project (Interactivity with JavaScript).</p>
  </footer>

</body>
</html>
