<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Photo Gallery | Nguyen Kiet</title>
  <link rel="stylesheet" href="css/gallery.css">
  <script src="js/gallery.js" defer></script>
</head>
<body>

  <header>
    <h1>Interactive Photo Gallery</h1>
    <p>By Nguyen Kiet - Interactivity with JavaScript</p>
  </header>

  <main>
    <div id="image">
      Hover over an image below to display here.
    </div>

    <div class="thumbnails">
      <img class="preview" alt="Lush Forest Foliage" src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()">
      <img class="preview" alt="Majestic Alpine Peak" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()">
      <img class="preview" alt="Serene Coastal Sunset" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()">
      <img class="preview" alt="Vibrant Autumn Pathway" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()">
      <img class="preview" alt="Starlit Mountain Vista" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()">
      <img class="preview" alt="Emerald River Valley" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&auto=format&fit=crop" onmouseover="upDate(this)" onmouseout="unDo()">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Nguyen Kiet. Created for University of Michigan Web Design Specialization.</p>
  </footer>

</body>
</html>
